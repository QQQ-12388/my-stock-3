<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Monstar 銷售量即時監測儀表板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        cardBorder: '#334155',
                        accentGreen: '#10b981',
                        accentBlue: '#3b82f6'
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'flash-green': 'flashGreen 1s ease-out',
                        'bounce-subtle': 'bounceSubtle 0.5s ease-in-out'
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                            '50%': { opacity: '0.6', transform: 'scale(1.02)' }
                        },
                        flashGreen: {
                            '0%': { backgroundColor: 'rgba(16, 185, 129, 0.4)', color: '#6ee7b7', transform: 'scale(1.05)' },
                            '100%': { backgroundColor: 'transparent', color: 'inherit', transform: 'scale(1)' }
                        },
                        bounceSubtle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-4px)' }
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <header class="glass-card border-b border-cardBorder sticky top-0 z-50 px-4 py-3 sm:px-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-emerald-500 to-blue-600 p-2.5 rounded-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-chart-line text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        K-Monstar 銷售即時監測儀表板
                    </h1>
                    <p class="text-xs text-slate-400">實時追蹤簽名會專輯銷售動態與庫存變化</p>
                </div>
            </div>

            <div class="flex items-center flex-wrap gap-3">
                <div id="connection-status" class="flex items-center space-x-2 bg-emerald-950/60 border border-emerald-500/30 px-3 py-1.5 rounded-full text-xs font-medium text-emerald-400 shadow-inner">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span id="status-text">連線正常 (15秒輪詢)</span>
                </div>

                <button id="refresh-btn" onclick="manualRefresh()" class="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 active:scale-95 transition border border-slate-700 px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-200 shadow-sm cursor-pointer">
                    <i id="refresh-icon" class="fa-solid fa-rotate"></i>
                    <span>立即重新整理</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full px-4 sm:px-8 py-6 space-y-6 flex-grow">

        <!-- Error Alert Banner -->
        <div id="error-banner" class="hidden bg-red-950/80 border border-red-500/40 p-4 rounded-xl text-red-200 flex items-start space-x-3 shadow-lg">
            <i class="fa-solid fa-triangle-exclamation text-red-400 text-lg mt-0.5"></i>
            <div class="flex-1">
                <h4 class="font-bold text-sm text-red-300">資料抓取發生異常</h4>
                <p id="error-message" class="text-xs text-red-200/80 mt-1">無法連線至 API 或發生跨域 CORS 限制，系統將繼續每 15 秒自動重試...</p>
            </div>
            <button onclick="dismissError()" class="text-red-400 hover:text-red-200 text-xs font-bold px-2 py-1"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Product Title Banner -->
        <div class="glass-card rounded-2xl p-5 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-l-4 border-l-emerald-500">
            <div>
                <span class="inline-block bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold px-2.5 py-1 rounded-md mb-2">
                    <i class="fa-solid fa-compact-disc mr-1"></i> 監控中商品
                </span>
                <h2 id="product-title" class="text-base sm:text-lg font-bold text-white tracking-wide">
                    載入中商品資訊...
                </h2>
            </div>
            <div class="flex items-center space-x-4 bg-slate-900/60 px-4 py-2.5 rounded-xl border border-slate-800 text-xs text-slate-300 w-full md:w-auto justify-between md:justify-start">
                <div>
                    <span class="text-slate-400 block">最後更新時間</span>
                    <span id="last-updated" class="font-mono font-semibold text-emerald-400 text-sm">--:--:--</span>
                </div>
                <div class="h-8 w-px bg-slate-800"></div>
                <div>
                    <span class="text-slate-400 block">下次更新倒數</span>
                    <div class="flex items-center space-x-2">
                        <span id="countdown-timer" class="font-mono font-semibold text-blue-400 text-sm">15s</span>
                        <div class="w-16 bg-slate-800 rounded-full h-1.5 overflow-hidden">
                            <div id="progress-bar" class="bg-blue-500 h-full w-full transition-all duration-1000 ease-linear"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Metric Cards Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
            <!-- Total Sold Card -->
            <div class="glass-card rounded-2xl p-5 shadow-xl relative overflow-hidden group hover:border-slate-600 transition">
                <div class="absolute -right-6 -bottom-6 text-slate-800/40 text-7xl font-bold select-none pointer-events-none group-hover:scale-110 transition">
                    <i class="fa-solid fa-fire"></i>
                </div>
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">累積總銷售量</p>
                        <h3 id="total-sold" class="text-3xl sm:text-4xl font-extrabold text-white mt-2 tracking-tight">--</h3>
                    </div>
                    <div class="bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20 text-emerald-400">
                        <i class="fa-solid fa-basket-shopping text-lg"></i>
                    </div>
                </div>
                <div class="mt-4 flex items-center text-xs text-slate-400">
                    <span class="text-emerald-400 font-semibold mr-1.5 flex items-center"><i class="fa-solid fa-arrow-trend-up mr-1"></i> 實時</span> 來自 variants 商品數據加總
                </div>
            </div>

            <!-- Sales Delta Card -->
            <div class="glass-card rounded-2xl p-5 shadow-xl relative overflow-hidden group hover:border-slate-600 transition">
                <div class="absolute -right-6 -bottom-6 text-slate-800/40 text-7xl font-bold select-none pointer-events-none group-hover:scale-110 transition">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">過去 15 秒銷量變化 (Δ)</p>
                        <h3 id="sales-delta" class="text-3xl sm:text-4xl font-extrabold text-blue-400 mt-2 tracking-tight">0</h3>
                    </div>
                    <div class="bg-blue-500/10 p-3 rounded-xl border border-blue-500/20 text-blue-400">
                        <i class="fa-solid fa-chart-line text-lg"></i>
                    </div>
                </div>
                <div class="mt-4 flex items-center text-xs text-slate-400">
                    <span id="delta-status-desc" class="text-slate-300">目前數據保持穩定</span>
                </div>
            </div>

            <!-- Stock Status Card -->
